<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Live demo</title>
<link rel="preload" href="/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* A sample "live site" for a project: it stands in for the real product until its live URL is set in the editor. */
  @font-face { font-family: "Geist"; font-weight: 300 700; font-display: swap; src: url("/fonts/geist-latin.woff2") format("woff2"); }
  @font-face { font-family: "Geist Mono"; font-weight: 400 500; font-display: swap; src: url("/fonts/geist-mono-latin.woff2") format("woff2"); }
  :root { --bg: #0b0c10; --panel: #13141b; --line: rgba(237, 237, 240, 0.1); --fg: #ededf0; --muted: #8b8f9a; --c: #7b8cff; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: radial-gradient(1200px 600px at 70% -10%, color-mix(in srgb, var(--c) 18%, transparent), transparent 60%), var(--bg); color: var(--fg); font: 16px/1.6 Geist, "Segoe UI", system-ui, sans-serif; min-height: 100vh; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
  .ribbon { font: 500 12px/1 "Geist Mono", ui-monospace, monospace; letter-spacing: 0.08em; text-align: center; padding: 9px 12px; background: color-mix(in srgb, var(--c) 16%, transparent); border-bottom: 1px solid var(--line); color: var(--muted); }
  .ribbon a { color: var(--fg); border-bottom: 1px solid var(--line); margin-left: 6px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 18px 0; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: -0.01em; }
  .logo i { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, var(--c), color-mix(in srgb, var(--c) 40%, #fff)); display: grid; place-items: center; font-style: normal; font-size: 13px; color: #0b0c10; }
  nav { display: flex; gap: 22px; font-size: 14px; color: var(--muted); }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--line); font-size: 14px; font-weight: 500; }
  .btn.pri { background: var(--c); border-color: var(--c); color: #0b0c10; }
  .hero { padding: 70px 0 40px; display: grid; gap: 18px; max-width: 780px; }
  .tag { justify-self: start; font: 500 12px/1 "Geist Mono", ui-monospace, monospace; letter-spacing: 0.12em; text-transform: uppercase; color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 40%, transparent); padding: 7px 10px; border-radius: 999px; }
  h1 { margin: 0; font-size: clamp(2.2rem, 5vw, 3.6rem); line-height: 1.05; letter-spacing: -0.04em; font-weight: 600; }
  .sub { margin: 0; font-size: 1.12rem; color: var(--muted); max-width: 62ch; }
  .cta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
  .app { margin: 30px 0 60px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); overflow: hidden; box-shadow: 0 40px 80px -40px color-mix(in srgb, var(--c) 45%, transparent); }
  .bar { display: flex; align-items: center; gap: 7px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .bar b { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
  .bar span { margin-left: 10px; font: 12px/1 "Geist Mono", ui-monospace, monospace; color: var(--muted); }
  .body { display: grid; grid-template-columns: 200px 1fr; min-height: 380px; }
  .side { border-right: 1px solid var(--line); padding: 16px; display: grid; align-content: start; gap: 8px; font-size: 14px; color: var(--muted); }
  .side div { padding: 8px 10px; border-radius: 8px; }
  .side div.on { background: color-mix(in srgb, var(--c) 14%, transparent); color: var(--fg); }
  .main { padding: 22px; display: grid; gap: 18px; align-content: start; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .stat { border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 4px; }
  .stat small { font: 11px/1 "Geist Mono", ui-monospace, monospace; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .stat b { font-size: 1.6rem; font-weight: 600; letter-spacing: -0.02em; color: var(--c); }
  .stat s { font-size: 12px; color: var(--muted); }
  .chart { border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .chart svg { display: block; width: 100%; height: 160px; }
  footer { border-top: 1px solid var(--line); padding: 26px 0 40px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; font-size: 14px; color: var(--muted); }
  footer a { color: var(--fg); }
  .missing { padding: 120px 0; text-align: center; display: grid; gap: 14px; justify-items: center; }
  @media (max-width: 720px) { nav { display: none; } .body { grid-template-columns: 1fr; } .side { display: none; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
(async function () {
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const slugify = (s) => String(s).toLowerCase().replace(/\+/g, "-plus").replace(/#/g, "-sharp").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  const PALETTE = ["#a78bfa", "#38bdf8", "#fbbf24", "#2dd4bf", "#f472b6", "#fb923c", "#a3e635", "#f87171", "#e879f9"];   // the portfolio's domain colours, in filter order
  const slug = decodeURIComponent((location.pathname.match(/^\/demo\/([^/]+)/) || [])[1] || "");
  let S = null;
  for (const url of ["/api/site", "/site.json"]) { try { const r = await fetch(url, { cache: "no-store" }); if (r.ok) { S = await r.json(); break; } } catch (e) {} }
  const app = document.getElementById("app");
  const p = S && (S.work.projects || []).find((x) => x && !x.hidden && slugify(x.slug || x.title) === slug);
  if (!p) { app.innerHTML = `<div class="wrap missing"><h1>Demo not found</h1><p class="sub">This project has no demo page.</p><a class="btn" href="/">Back to the portfolio</a></div>`; return; }
  const keys = (S.work.filters || []).filter((f) => f.key !== "all").map((f) => f.key), ci = keys.indexOf(p.category);
  document.documentElement.style.setProperty("--c", ci >= 0 ? PALETTE[ci % PALETTE.length] : "#7b8cff");
  document.title = `${p.title} · live demo`;
  const d = p.detail || {}, results = (d.results || []).slice(0, 3);
  const label = ((S.work.filters || []).find((f) => f.key === p.category) || {}).label || "";
  const down = /^[-−]/.test(String((p.metric && p.metric.value) || ""));
  const pts = Array.from({ length: 24 }, (_, k) => { const t = k / 23; return [t * 600, 140 - (down ? 1 - t : t) * 100 + Math.sin(k * 1.7) * 8]; });
  const line = pts.map(([x, y], k) => `${k ? "L" : "M"}${x.toFixed(1)} ${y.toFixed(1)}`).join(" ");
  const nav = (d.architecture || []).slice(0, 4);
  app.innerHTML = `
    <div class="ribbon">Sample live page for this portfolio · replace it with the real URL in the editor <a href="/work/${slugify(p.title)}">Back to the project</a></div>
    <div class="wrap">
      <header><span class="logo"><i>${esc(p.title[0])}</i>${esc(p.title)}</span>
        <nav><a>Product</a><a>Docs</a><a>Pricing</a><a>Changelog</a></nav>
        <a class="btn" href="/work/${slugify(p.title)}">Sign in</a></header>
      <section class="hero">${label ? `<span class="tag">${esc(label)}</span>` : ""}
        <h1>${esc(p.outcome || p.title)}</h1>
        <p class="sub">${esc(p.blurb || "")}</p>
        <div class="cta"><a class="btn pri" href="#app">Start free</a><a class="btn" href="/work/${slugify(p.title)}">How it was built →</a></div></section>
      <div class="app" id="app-ui">
        <div class="bar"><b></b><b></b><b></b><span>app.${esc(slugify(p.title))}.dev</span></div>
        <div class="body">
          <div class="side">${["Overview", ...nav].map((n, k) => `<div${k === 0 ? ' class="on"' : ""}>${esc(n)}</div>`).join("")}</div>
          <div class="main">
            <div class="stats">${results.map((r) => `<div class="stat"><small>${esc(r.label)}</small><b>${esc(r.after)}</b><s>was ${esc(r.before)}</s></div>`).join("")}</div>
            <div class="chart"><svg viewBox="0 0 600 160" preserveAspectRatio="none"><path d="${line} L600 160 L0 160 Z" fill="var(--c)" fill-opacity=".14"/><path d="${line}" fill="none" stroke="var(--c)" stroke-width="2.5"/></svg></div>
          </div>
        </div>
      </div>
      <footer><span>© ${new Date().getFullYear()} ${esc(p.title)}</span><span>Built by <a href="/">${esc(S.meta.name)}</a></span></footer>
    </div>`;
})();
</script>
</body>
</html>
